<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 운동일지 앱 · 버전 2026-11-23 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="악어일지">

<link rel="icon" href="icon-192.png">
<title>악어일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{color-scheme:light only;
    --bg:#f4f6f9; --card:rgba(255,255,255,.8); --card2:#eef1f5; --line:#e2e6ec;
    --text:#1b1f27; --sub:#5b6472; --dim:#939aa6;
    --acc:#2563eb; --acc2:#3b82f6; --ok:#16a34a; --warn:#d97706; --bad:#e5484d;
    --chest:#ff8a5c; --back:#5aa9ff; --legs:#4cc27e; --shoulder:#c38bff; --tri:#ffb37f; --bi:#7fd3ff; --abs:#f2c14e; --forearm:#9fb3c8; --cardio:#ff8fb1; --warmup:#b0b5bd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html[data-page=today]{--wave:#7aa7ff;--line:#c7d9ff;--tint:#b9d0ff} html[data-page=diet]{--wave:#ff8fa3;--line:#ffc9d2;--tint:#ffbfcb} html[data-page=history]{--wave:#6fd39a;--line:#b9e5c9;--tint:#aee3c2} html[data-page=stats]{--wave:#a996ff;--line:#d6ccff;--tint:#cfc3ff} html[data-page=ex]{--wave:#ffb562;--line:#ffd9a8;--tint:#ffd49c}
  html,body{margin:0;background:var(--bg);forced-color-adjust:none;color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  .deco{position:absolute;top:0;left:0;right:0;height:85vh;min-height:520px;pointer-events:none;z-index:0;background:radial-gradient(ellipse 150% 100% at 0% 0%, var(--wave,#7aa7ff) 0%, color-mix(in srgb, var(--wave,#7aa7ff) 45%, transparent) 35%, transparent 80%);opacity:.75}
  .app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 150px;min-height:100vh}
  .gear{position:relative;width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:18px;color:var(--sub);cursor:pointer;display:grid;place-items:center}
  .gear.on{border-color:var(--acc);color:var(--acc)}
  .gear .rdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
  .brand{font-weight:900;font-size:22px;letter-spacing:-.5px;position:relative;z-index:0}
  .brand span{color:var(--acc)}
  .sync{font-size:12px;color:var(--dim)}
  .sync.ok{color:var(--ok)} .sync.err{color:var(--bad)}
  .banner{background:#fff4dc;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .datebar .d{flex:1;text-align:center;font-weight:700;font-size:17px}
  .datebar .d small{display:block;color:var(--sub);font-weight:500;font-size:12px}
  .icon{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .ex-head{display:flex;align-items:flex-start;gap:8px}
  .ex-name{font-weight:700;font-size:16px;flex:1}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:2px;color:#111}
  .target{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--sub);margin-top:3px}
  .prev{font-size:12.5px;color:var(--dim);margin:6px 0 10px}
  .prev b{color:var(--sub);font-weight:500}
  .x{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:0 4px}
  .x.armed{color:var(--bad);font-size:13px;font-weight:700}
  .sets{display:grid;gap:6px}
  .srow{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:6px;align-items:center}
  .srow .n{font-family:"JetBrains Mono",monospace;color:var(--dim);text-align:center;font-size:13px}
  .srow input,.srow select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
  .srow select{font-family:"Noto Sans KR";font-size:12.5px;color:var(--sub);padding:9px 2px}
  .srow input:focus{border-color:var(--acc)}
  .srow input::placeholder{color:#a3aab5}
  .srow .unit{position:relative}
  .srow .unit:after{content:attr(data-u);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);pointer-events:none}
  .chk{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--dim);font-size:18px;cursor:pointer}
  .srow.done input,.srow.done select{background:#e9f8ef;border-color:#b9e6c9;color:#11663a}
  .srow.done .chk{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:900}
  .srow.c3,.shead.c3{grid-template-columns:28px 1fr 1fr 1fr 52px}
  .shead{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:6px;font-size:11px;color:var(--dim);text-align:center;margin-bottom:2px}
  .ex-foot{display:flex;gap:8px;margin-top:10px;align-items:center}
  .ghost{background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;color:var(--sub);cursor:pointer;font-size:13px}
  .e1rm{margin-left:auto;font-size:12px;color:var(--dim);font-family:"JetBrains Mono",monospace}
  .sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:18px 2px 8px;letter-spacing:.3px}
  .daily{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .daily input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-family:"JetBrains Mono",monospace;outline:none}
  .toggle{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px}
  .sw{width:48px;height:28px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer}
  .sw:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--dim);top:2px;left:2px;transition:.15s}
  .sw.on{background:var(--ok);border-color:var(--ok)} .sw.on:after{left:22px;background:#fff}
  textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px;resize:vertical;outline:none}
  .addform{display:grid;grid-template-columns:1fr 90px 60px;gap:6px}
  .addform input,.addform select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;outline:none;width:100%}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
  .btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .summary{display:flex;gap:8px}
  .summary div{flex:1;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
  .summary b{display:block;font-family:"JetBrains Mono",monospace;font-size:18px}
  .summary span{font-size:11px;color:var(--sub)}
  .rest-day{text-align:center;color:var(--sub);padding:28px 10px}
  .rest-day b{display:block;font-size:20px;color:var(--text);margin-bottom:6px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav .in{display:flex;max-width:540px;width:100%}
  nav button{flex:1;background:none;border:none;padding:10px 0 12px;color:var(--dim);font-size:12px;cursor:pointer}
  nav button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
  nav button.on{color:var(--acc);font-weight:600}
  nav button i svg{width:23px;height:23px;display:block;margin:0 auto 3px} nav button.on i svg{stroke-width:2.4}
  .timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:none;justify-content:center;padding:0 12px}
  .timer .in{max-width:516px;width:100%;background:#eef4ff;border:1px solid #c7d8fb;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(20,30,50,.15)}
  .timer .t{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700;color:var(--acc2);min-width:84px}
  .timer .lbl{flex:1;font-size:12px;color:var(--sub);line-height:1.3}
  .timer .bar{height:3px;background:#c7d8fb;border-radius:3px;margin-top:5px;overflow:hidden}
  .timer .bar i{display:block;height:100%;background:var(--acc);width:100%}
  .timer button{background:#fff;border:1px solid #c7d8fb;color:var(--acc);border-radius:9px;padding:7px 9px;font-size:12.5px;cursor:pointer}
  .timer.end .in{background:#e9f8ef;border-color:#b9e6c9} .timer.end .t{color:var(--ok)}
  /* history */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);margin:0 -4px}
  .cal .h{font-size:12px;font-weight:700;color:var(--sub);padding:8px 0;text-align:center;border-bottom:1px solid var(--line)}
  .cal .h.sat,.cal .c.sat .num{color:#2563eb} .cal .h.sun,.cal .c.sun .num{color:#e5484d}
  .cal .c{min-height:64px;border-bottom:1px solid var(--line);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
  .cal .c:not(:nth-child(7n)){border-right:1px solid var(--line)}
  .cal .c .num{font-size:13px;font-weight:500;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
  .cal .c.out .num{opacity:.3} .cal .c.out{cursor:default}
  .cal .c.today .num{font-weight:700;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2.5px;text-underline-offset:4px}
  .cal .c.sel{box-shadow:inset 0 0 0 1.5px var(--acc);border-radius:6px}
  .cal .c .plab{font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;color:#111;max-width:100%;overflow:hidden;white-space:nowrap}
  .cal .c .plab.plan{background:none;border:1px dashed var(--dim);color:var(--sub)}
  .hist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .hist-item:last-child{border-bottom:none}
  .hist-item .dd{font-family:"JetBrains Mono",monospace;color:var(--sub);font-size:13px;width:70px;white-space:nowrap}
  .hist-item .tt{flex:1}
  .hist-item .tt small{display:block;color:var(--dim);font-size:12px}
  .empty-note{color:var(--dim);font-size:13px;text-align:center;padding:16px}
  /* stats */
  .prow{margin:10px 0 14px}
  .prow .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
  .prow .top b{font-family:"JetBrains Mono",monospace}
  .gauge{position:relative;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
  .gauge .band{position:absolute;top:0;bottom:0;background:rgba(22,163,74,.16);border-left:1px dashed rgba(22,163,74,.6);border-right:1px dashed rgba(22,163,74,.6)}
  .gauge .fill{position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px}
  .freq{font-size:11.5px;padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:700}
  .freq.ok{background:#e3f6ea;color:var(--ok)} .freq.no{background:#fff3d6;color:var(--warn)}
  .legend{font-size:12px;color:var(--dim);margin-top:4px}
  select.full{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
  .ai{white-space:pre-wrap;line-height:1.7;font-size:14px;color:var(--text);margin-top:10px}
  .ai:empty{display:none}
  .muted{color:var(--dim);font-size:12.5px}
  .hidden{display:none!important}
  nav button i{font-size:18px}
  .kcal .khead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  .kcal .khead b{display:block;font-family:"JetBrains Mono",monospace;font-size:30px;line-height:1.2} .kcal .khead small{font-size:13px;color:var(--sub)}
  .ghost.sm{padding:6px 10px;font-size:12px}
  .kbar{position:relative;height:10px;background:var(--card2);border-radius:6px;overflow:visible}
  .kbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:6px} .kbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.6}
  .krow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--sub)} .krow span:last-child{font-family:"JetBrains Mono",monospace;color:var(--text)}
  .krow small{color:var(--dim);font-size:11.5px} .ksub{font-size:11.5px;color:var(--dim);margin:-2px 0 4px 10px}
  .krow.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;color:var(--text);font-weight:500}
  .kres{margin-top:10px;padding:11px;border-radius:10px;background:var(--card2);text-align:center;font-size:13.5px;color:var(--sub)}
  .kres b{font-family:"JetBrains Mono",monospace;font-size:16px} .kres.minus b{color:var(--ok)} .kres.plus b{color:var(--warn)}
  .meal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px} .meal .mhead b{font-size:15px} .meal .mhead span{font-family:"JetBrains Mono",monospace;font-size:13px}
  .frow{display:grid;grid-template-columns:1fr 62px 88px 24px;gap:6px;align-items:center;margin-bottom:6px}
  .frow input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;font-size:14px}
  .frow input:focus{border-color:var(--acc)} .frow .unit{position:relative} .frow .unit input{padding-right:34px;text-align:right;font-family:"JetBrains Mono",monospace}
  .frow .unit:after{content:attr(data-u);position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);pointer-events:none}
  .sugg{background:var(--card2);border:1px solid var(--line);border-radius:10px;margin:-2px 0 8px;overflow:hidden}
  .sugg button{width:100%;display:flex;justify-content:space-between;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 12px;font-size:13.5px;cursor:pointer;text-align:left}
  .sugg button:last-child{border-bottom:none} .sugg b{font-family:"JetBrains Mono",monospace;color:var(--acc2);font-weight:500;font-size:12.5px}
  .addf{width:100%;margin-top:2px}
  .thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto} .thumbs img{width:76px;height:100px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--line)}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px} .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cmp figure,.pgrid figure{margin:0} .cmp img,.pgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:pointer;display:block}
  .cmp figcaption,.pgrid figcaption{font-size:11.5px;color:var(--sub);text-align:center;margin-top:4px;font-family:"JetBrains Mono",monospace}
  .pview{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .pview img{max-width:100%;max-height:78vh;border-radius:12px} .pvbar{display:flex;gap:8px;align-items:center;margin-top:12px;width:100%;max-width:420px}
  .pvbar span{flex:1;color:var(--sub);font-family:"JetBrains Mono",monospace;font-size:13px} .pvbar .btn{padding:10px 16px}
  .search{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:10px}
  .search:focus-within{border-color:var(--acc)} .search span{font-size:14px;opacity:.7}
  .search input::-webkit-search-cancel-button{display:none}
  .search input{flex:1;background:none;border:none;outline:none;padding:11px 0;font-size:15px;color:var(--text)}
  .seg.seg3{grid-template-columns:1fr 1fr 1fr}
  .restpop{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(20,30,50,.35);padding:24px}
  .rpbox{position:relative;overflow:hidden;background:#fff;border:1px solid #b9e6c9;box-shadow:0 12px 40px rgba(20,30,50,.18);border-radius:20px;padding:24px 20px 18px;width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
  .rpbox .rpicon{font-size:34px} .rpbox b{font-size:22px;color:var(--ok)} .rpbox span{color:var(--sub);font-size:14px;margin-bottom:8px}
  .rpbox .btn{width:100%;padding:12px;background:var(--ok);color:#fff}
.savepop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:90;pointer-events:none}
  .savepop>div{background:#fff;border:1px solid #b9e6c9;color:var(--text);border-radius:16px;padding:18px 26px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(20,30,50,.15);animation:spop .18s ease-out}
  .savepop i{font-style:normal;color:var(--ok);font-size:20px} @keyframes spop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
  .rpbar{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--ok);transform-origin:left}
  .restpop.in .rpbar{animation:rpshrink 3s linear forwards} @keyframes rpshrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  .puhead{display:flex;align-items:center;gap:8px;margin:16px 0 8px} .puhead .muted{flex:1;font-size:12.5px}
  .restbtn{background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--acc2);font-size:12px;padding:5px 8px;cursor:pointer;font-family:"JetBrains Mono",monospace}
  .pugrid{display:grid;gap:6px} .pugrid.g5{grid-template-columns:repeat(5,1fr)} .pugrid.g2{grid-template-columns:1fr 1fr}
  .pugrid input,.purow input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;font-family:"JetBrains Mono",monospace;outline:none;font-size:14px}
  .pugrid input:focus,.purow input:focus{border-color:var(--acc)}
  .pugrid .unit{position:relative} .pugrid .unit input{padding-right:30px} .pugrid .unit:after{content:attr(data-u);position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);pointer-events:none}
  .purow{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px} .purow span{font-size:13px;color:var(--sub);white-space:nowrap}
  .lbl{font-size:14px;font-weight:500;color:var(--text);margin-bottom:8px} .lbl .muted{font-weight:400;font-size:12.5px}
  .btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
  .savenote{font-size:12.5px;color:var(--dim);text-align:center;margin:-4px 0 10px}
  .runrow{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
  .runrow .unit{position:relative} .runrow .unit:after{content:attr(data-u);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);pointer-events:none}
  .runrow input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 26px 9px 10px;text-align:center;font-family:"JetBrains Mono",monospace;outline:none}
  .runrow input:focus{border-color:var(--acc)}

  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; return top? `var(--${top[0]})` : 'var(--sub)';
}
function ask(title, text, danger){

}
function draftDaily(date){ if(!S.dd[date]){ const l=getLog(date); const b=(l&&l.daily)||{}; S.dd[date]={push:(b.push||['','','']).slice(),pullup:JSON.parse(JSON.stringify(puObj(b.pullup))),run:{km:'',min:'',sec:'',...(b.run||{})}}; } return S.dd[date]; }
// 저장 버튼: 마지막 저장과 다를 때만 색 채움
function normV(v){ if(v==null) return ''; if(Array.isArray(v)){ const a=v.map(normV); while(a.length && a[a.length-1]==='') a.pop(); return a.length?a:''; }
  if(typeof v==='object'){ const o={}; Object.keys(v).sort().forEach(k=>{ const x=normV(v[k]); if(x!=='') o[k]=x; }); return Object.keys(o).length?o:''; }

    const done=saved(l), lab=l&&l.exercises.length? (PARTS[partsOf(l).filter(p=>!['warmup','cardio'].includes(p))[0]]||'') : '';
    const cls=[wd===6?'sat':'', wd===0?'sun':'', ds===todayStr()?'today':'', ds===S.calSel?'sel':'', inMonth?'':'out'].join(' ');
    return `<div class="c ${cls}" ${inMonth?`data-act="calsel" data-d="${ds}"`:''}><span class="num">${dd.getDate()}</span>${lab&&inMonth?`<span class="plab ${done?'':'plan'}" style="${done?`background:${colorOf(l)}`:''}">${esc(lab)}</span>`:''}</div>`; };
  for(let i=lead;i>0;i--) h+=cell(ymd(new Date(y,mo-1,1-i)),false);
  for(let d=1; d<=days; d++) h+=cell(`${m}-${String(d).padStart(2,'0')}`,true);
  const tail=(7-(lead+days)%7)%7; for(let i=1;i<=tail;i++) h+=cell(ymd(new Date(y,mo,i)),false);
  h += `</div><div class="legend" style="margin-top:10px"><span style="color:var(--chest)">●</span> 가슴 &nbsp; <span style="color:var(--back)">●</span> 등 &nbsp; <span style="color:var(--legs)">●</span> 하체 &nbsp; <span style="color:var(--shoulder)">●</span> 어깨</div></div>`;
  h += dayDetail(S.calSel, byDate[S.calSel]);
  const month = logs.filter(l=>l.date.startsWith(m) && (l.exercises.length || (l.daily&&(l.daily.push.some(v=>v!=='')||puTotal(l.date,l.daily.pullup)>0||num(runOf(l).km))))).reverse();
  h += `<div class="sec-title">이번 달 기록 ${month.length}일</div><div class="card">`;
  if (!month.length) h+=`<div class="empty-note">아직 기록이 없어요</div>`;
  month.forEach(l=>{ const d=parse(l.date);
    h+=`<div class="hist-item" data-act="calsel" data-d="${l.date}" data-top="1"><div class="dd">${d.getMonth()+1}/${d.getDate()} ${DOW[d.getDay()]}</div>
      <div class="tt"><span class="tag" style="background:${colorOf(l)}">${esc(titleOf(l))}</span><small>${doneSets(l)}세트${volume(l)?` · ${Math.round(volume(l)).toLocaleString()}kg`:''}${l.startedAt?` · ${durText(l)}`:''}${l.memo?` · ${esc(l.memo.slice(0,24))}${l.memo.length>24?'…':''}`:''}</small></div><span class="muted">›</span></div>`; });
  h += `</div>`;
  $('#view').innerHTML = h;
}

function dayDetail(ds, l){
  const d=parse(ds);
  let h=`<div class="sec-title">${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})</div><div class="card day">`;
  const exs = saved(l) ? l.exercises.filter(e=>e.sets.some(s=>s.done)) : [];
  const pending = l && !saved(l) && l.exercises.length>0;
  const push = l ? l.daily.push.filter(v=>v!=='') : [];
  const puS = l ? puSummary(ds, l.daily.pullup) : '';
  if(!exs.length && !push.length && !puS && !(l&&num(runOf(l).km)) && !(l&&hasDiet(l))){
    h+=`<div class="empty-note">${pending?'운동 완료를 누르지 않아 저장되지 않은 운동이 있어요':'이 날은 운동 기록이 없어요'}</div>`;
  } else {
    if(pending) h+=`<div class="muted" style="margin-bottom:6px">운동 완료 전이라 운동 기록은 아직 저장되지 않았어요</div>`;
    if(exs.length) h+=`<div class="dhead"><span class="tag" style="background:${colorOf(l)}">${esc(titleOf(l))}</span><span class="muted">${doneSets(l)}세트${volume(l)?` · ${Math.round(volume(l)).toLocaleString()}kg`:''}${l.startedAt?` · ${durText(l)}`:''}</span></div>`;
    exs.forEach(e=>{ h+=`<div class="dline"><b>${esc(e.name)}</b><span>${e.sets.filter(s=>s.done).map(s=>fmtSet(e,s)).join('  ')}</span>${(e.memo||'').trim()?`<small>${esc(e.memo.trim())}</small>`:''}</div>`; });
    if(num(runOf(l).km)) h+=`<div class="dline"><b>러닝</b><span>${esc(runSummary(runOf(l)).replace('러닝 ',''))}</span></div>`;
    if(push.length) h+=`<div class="dline"><b>푸쉬업</b><span>${push.join(' / ')}</span></div>`;
    if(puS) h+=`<div class="dline"><b>풀업</b><span>${esc(puS)}</span></div>`;
    // 운동 소모
    const B=burnOf(l?(saved(l)?l:{...l,exercises:[]}):null, ds);
    if(B.total) h+=`<div class="dsum"><div class="krow tot"><span>운동 소모 칼로리 <small>(대략)</small></span><span>${kc(B.total)} kcal</span></div>
      <div class="ksub">${[B.weights?`근력 ${kc(B.weights)}`:'',B.cardio?`유산소 ${kc(B.cardio)}`:'',B.run?`러닝 ${kc(B.run)}`:'',B.body?`푸쉬업·풀업 ${kc(B.body)}`:''].filter(Boolean).join(' · ')} · 체중 ${B.wt}kg 기준</div></div>`;
    // 식사
    if(l && hasDiet(l)){ const dt=dietOf(l);
      h+=`<div class="dsub">식사</div>`;
      MEALS.forEach(([k,n])=>{ const it=dt[k].filter(x=>(x.n||'').trim()||num(x.k)); if(!it.length) return;
        h+=`<div class="dline"><b>${n} <em class="dk">${kc(mealKcal(dt[k]))} kcal</em></b><span>${it.map(x=>`${esc((x.n||'').trim()||'음식')}${num(x.q)&&num(x.q)!==1?` ×${num(x.q)}`:''}${num(x.k)?` ${x.k}`:''}`).join(' · ')}</span></div>`; });
      if(num(dt.wt)) h+=`<div class="dline"><b>체중</b><span>${dt.wt}kg</span></div>`;
    }
    // 종합
    const bmr=bmrFor(ds), intake=l?dietKcal(l):0;
    if(bmr && (intake || B.total)){ const life=Math.round(bmr*0.2), out=bmr+life+B.total, diff=intake-out;
      h+=`<div class="dsub">하루 종합</div><div class="dsum">
        <div class="krow"><span>기초대사량</span><span>${kc(bmr)}</span></div>
        <div class="krow"><span>일상 활동 <small>(20%)</small></span><span>${kc(life)}</span></div>
        <div class="krow"><span>운동 소모</span><span>${kc(B.total)}</span></div>
        <div class="krow tot"><span>총 소모</span><span>${kc(out)}</span></div>
        <div class="krow"><span>먹은 칼로리</span><span>${kc(intake)}</span></div>
        <div class="kres ${intake?(diff>0?'plus':'minus'):''}">${intake?(diff>0?`<b>+${kc(diff)} kcal</b> 소모보다 더 먹었어요`:`<b>−${kc(-diff)} kcal</b> 소모보다 덜 먹었어요`):'식사를 넣으면 하루 수지가 나와요'}</div></div>`;
    } else if(!bmr && (intake||B.total)) h+=`<div class="muted" style="font-size:12.5px;margin-top:10px">식단 탭에서 기초대사량을 넣으면 하루 종합이 나와요</div>`;
  }
  h+=`<button class="ghost" style="width:100%;margin-top:10px" data-act="open" data-d="${ds}">${l&&l.exercises.length?'이 날 기록 열기 / 수정':'이 날 운동 기록하기'}</button></div>`;
  return h;
}

/* ---------- 통계 화면 ---------- */
function renderStats(){
  const ws = S.statsWeek || weekStart(todayStr()); S.statsWeek = ws;
  const we = addDays(ws,6);
  const logs = allLogs().filter(l=>l.date>=ws && l.date<=we);
  const sets={}, days={}; STAT_PARTS.forEach(p=>{sets[p]=0;days[p]=new Set();});
  let push=0, pull=0, runKm=0;
  logs.forEach(l=>{
    if(saved(l)) l.exercises.forEach(e=>{ const n=e.sets.filter(s=>s.done).length; if(n && sets[e.part]!==undefined){ sets[e.part]+=n; days[e.part].add(l.date);} });
    push += l.daily.push.reduce((a,v)=>a+(num(v)||0),0); pull += puTotal(l.date,l.daily.pullup); runKm += num(runOf(l).km)||0;
  });
  const a=parse(ws), b=parse(we);
  let h = `<div class="datebar"><button class="icon" data-act="wk" data-n="-7">‹</button><div class="d">${a.getMonth()+1}/${a.getDate()} – ${b.getMonth()+1}/${b.getDate()}<small>${ws===weekStart(todayStr())?'이번 주':'주간'}</small></div><button class="icon" data-act="wk" data-n="7">›</button></div>
  <div class="card"><div class="sec-title" style="margin-top:0">부위별 주당 세트 · 목표 10~20세트, 주 2회</div>`;
  const MAX=24;
  STAT_PARTS.forEach(p=>{
    const n=sets[p], f=days[p].size;
    const col = n>20 ? 'var(--warn)' : n>=10 ? 'var(--ok)' : 'var(--'+p+')';
    h+=`<div class="prow"><div class="top"><span>${PARTS[p]}<span class="freq ${f>=2?'ok':'no'}">주 ${f}회</span></span><b style="color:${col}">${n}<span class="muted"> 세트</span></b></div>
      <div class="gauge"><div class="band" style="left:${10/MAX*100}%;width:${10/MAX*100}%"></div><div class="fill" style="width:calc(${Math.min(n,MAX)/MAX*100}% - 4px);background:${col}"></div></div></div>`;
  });
  h+=`<div class="legend">초록 띠가 주당 10~20세트 구간이에요. 푸시업·풀업 루틴은 세트 수에 넣지 않았어요.</div></div>
  <div class="card summary"><div><b>${logs.filter(l=>saved(l)).length}</b><span>운동한 날</span></div><div><b>${push}</b><span>푸시업 합계</span></div><div><b>${pull}</b><span>풀업 합계</span></div><div><b>${Math.round(runKm*10)/10}</b><span>러닝 km</span></div></div>`;

  const names = [...new Set(allLogs().flatMap(l=>l.exercises.filter(e=>e.sets.some(s=>s.done)).map(e=>e.name)))];
  if (!S.progEx || !names.includes(S.progEx)) S.progEx = names[0]||null;
  h += `<div class="sec-title">종목별 성장 (예상 1RM)</div><div class="card">`;
  if (!names.length) h+=`<div class="empty-note">세트를 완료하면 여기에 그래프가 생겨요</div>`;
  else { h+=`<select class="full" data-in="progEx">${names.map(n=>`<option ${n===S.progEx?'selected':''}>${esc(n)}</option>`).join('')}</select>${progChart(S.progEx)}`; }
  h += `</div><div class="sec-title">Claude에게 피드백 받기</div><div class="card">
    <div class="muted">최근 2주 기록을 복사해요. Claude 채팅에 붙여넣으면 17년 연구 기준으로 봐 줘요.</div>
    <button class="btn" style="margin-top:10px;width:100%" data-act="toclaude">최근 2주 기록 복사</button>
    <textarea class="ta-out hidden" id="claudeOut" readonly></textarea></div>`;
  $('#view').innerHTML = h;
}
function progChart(name){
  const pts = allLogs().filter(saved).map(l=>{ const e=l.exercises.find(x=>x.name===name); if(!e) return null;
    const best=Math.max(0,...e.sets.filter(s=>s.done).map(s=>e1rm(num(s.w),num(s.r)))); return best?{d:l.date,v:best}:null; }).filter(Boolean);
  if (!pts.length) return '';
  const W=480,H=180,pl=38,pr=12,pt=16,pb=26;
  const vs=pts.map(p=>p.v), lo=Math.floor(Math.min(...vs)*0.95), hi=Math.ceil(Math.max(...vs)*1.05)||1;
  const x=i=> pts.length===1? (pl+(W-pl-pr)/2) : pl+(W-pl-pr)*i/(pts.length-1);
  const y=v=> pt+(H-pt-pb)*(1-(v-lo)/((hi-lo)||1));
  const path = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const last=pts[pts.length-1], first=pts[0];
  const ticks=[lo,(lo+hi)/2,hi];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:12px">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#2e323a" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y(t)+4}" fill="#636a76" font-size="11" text-anchor="end">${Math.round(t)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#ff7a3d" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#ff7a3d"/>`).join('')}
    <text x="${x(0)}" y="${H-6}" fill="#636a76" font-size="11" text-anchor="${pts.length===1?'middle':'start'}">${first.d.slice(5).replace('-','/')}</text>
    ${pts.length>1?`<text x="${x(pts.length-1)}" y="${H-6}" fill="#636a76" font-size="11" text-anchor="end">${last.d.slice(5).replace('-','/')}</text>`:''}
  </svg><div class="muted">최근 ${fmt(last.v)}kg${pts.length>1?` · 처음보다 ${last.v-first.v>=0?'+':''}${fmt(last.v-first.v)}kg`:''}</div>`;
}

/* ---------- Claude로 보내기 / 백업 ---------- */
function claudeText(days){
  const from = addDays(todayStr(),-(days-1));
  const logs = allLogs().filter(l=>l.date>=from && hasContent(l));
  if(!logs.length) return '';
  const pf=profile(); let t = `[악어일지 기록 ${from} ~ ${todayStr()}]${num(pf.bmr)?` (기초대사량 ${pf.bmr}kcal${weightFor(todayStr())?`, 체중 ${weightFor(todayStr())}kg`:''})`:''}\n운동 기록이야. 17년 연구 기준(각 부위 주 2회, 고중량, 풀 가동범위, 주당 10~20세트, 중요한 운동 먼저)으로 봐 주고, 잘한 점 / 고칠 점 / 다음 주 바꿀 것을 알려줘.\n`;
  logs.forEach(l=>{ const d=parse(l.date);
    t += `\n${l.date}(${DOW[d.getDay()]}) ${titleOf(l)}${l.finishedAt?` · 운동 시간 ${durText(l)}`:''}\n`;
    (saved(l)?l.exercises:[]).filter(e=>e.sets.some(s=>s.done)).forEach(e=>{
      t += `- ${e.name}[${PARTS[e.part]||''}]: ${e.sets.filter(s=>s.done).map(s=>fieldsOf(e)?fmtSet(e,s):`${s.w||0}x${s.r}`).join(', ')}${(e.memo||'').trim()?` / 메모: ${e.memo.trim()}`:''}\n`; });
    const p=l.daily.push.filter(v=>v!==''); if(p.length) t+=`- 푸시업: ${p.join('/')}\n`;
    { const ps=puSummary(l.date,l.daily.pullup); if(ps) t+=`- 풀업: ${ps}\n`; }
    if(num(runOf(l).km)) t+=`- ${runSummary(runOf(l))}\n`;
    if(hasDiet(l)){ const dd=dietOf(l); t+=`- 식단 ${kc(dietKcal(l))}kcal: ${MEALS.map(([k,n])=>dd[k].filter(x=>(x.n||'').trim()).length?`${n} ${dd[k].filter(x=>(x.n||'').trim()).map(x=>`${x.n}${num(x.q)&&num(x.q)!==1?` ×${num(x.q)}`:''}${num(x.k)?`(${x.k})`:''}`).join(', ')}`:'').filter(Boolean).join(' / ')}${num(dd.wt)?` · 체중 ${dd.wt}kg`:''}\n`; const B=burnOf(l,l.date); if(B.total) t+=`- 운동 소모 추정 ${kc(B.total)}kcal\n`; if(bmrFor(l.date)) t+=`- 기초대사량 ${bmrFor(l.date)}kcal 기준\n`; }
    if((l.memo||'').trim()) t+=`- 메모: ${l.memo.trim()}\n`;
  });
  return t;
}
async function copyText(text, fallbackEl){
  try{ await navigator.clipboard.writeText(text); toast('복사했어요. Claude 채팅에 붙여넣으세요'); return true; }
  catch(e){ if(fallbackEl){ fallbackEl.value=text; fallbackEl.classList.remove('hidden'); fallbackEl.focus(); fallbackEl.select(); } toast('아래 글을 길게 눌러 복사하세요'); return false; }
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',2600); }

    <div class="row2"><button class="btn sec" data-act="claude" data-days="7">최근 1주</button><button class="btn sec" data-act="claude" data-days="28">최근 4주</button></div>

function backupJSON(withPhotos=true){ return JSON.stringify({app:'setlog',version:2,exportedAt:new Date().toISOString(),logs:S.logs,my:S.my,profile:profile(),photos:withPhotos?(S.photos||[]):undefined}); }
function markBackup(){ try{ localStorage.setItem('setlog.lastBackup', todayStr()); }catch(e){} updateGear(); }
function needBackup(){ const n=Object.keys(S.logs).length; if(n<3) return false; let last=''; try{ last=localStorage.getItem('setlog.lastBackup')||''; }catch(e){} if(!last) return true; return (parse(todayStr())-parse(last))/86400000 >= 14; }
function updateGear(){ const d=document.getElementById('gdot'); if(d) d.classList.toggle('hidden',!needBackup()); const g=document.getElementById('gear'); if(g) g.classList.toggle('on',S.tab==='more'); }
function mergeBackup(text){
  let data; try{ data=JSON.parse(text); }catch(e){ toast('백업 파일을 읽을 수 없어요'); return; }
  const logs = data && data.logs; if(!logs || typeof logs!=='object'){ toast('악어일지 백업 파일이 아니에요'); return; }
  let added=0;
  for(const k in logs){ const r=logs[k]; if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !r || !Array.isArray(r.exercises)) continue;
    if(!S.logs[k] || (r.updatedAt||0) > (S.logs[k].updatedAt||0)){ S.logs[k]=r; delete S.local[k]; added++; } }
  if(data.my && Array.isArray(data.my.list)) saveMy(data.my);
  if(data.profile && typeof data.profile==='object' && !num(profile().bmr)) saveProfile(data.profile);
  if(Array.isArray(data.photos)){ const have=new Set((S.photos||[]).map(p=>p.id)); Promise.all(data.photos.filter(p=>p&&p.id&&p.data&&!have.has(p.id)).map(p=>photoPut(p).catch(()=>{}))).then(loadPhotos).then(()=>render()); }
  lsSet(JSON.stringify(S.logs)); toast(`${added}일 기록을 불러왔어요`); render();
}

/* ---------- 내 운동 (루틴) ---------- */
function myRoutines(){ return (S.my && S.my.list) || DEFAULT_ROUTINES; }
function customEx(){ return (S.my && S.my.custom) || []; }
function restPrefs(){ return (S.my && S.my.rest) || {}; }
async function saveMy(patch){
  S.my = {list: myRoutines(), custom: customEx(), rest: restPrefs(), ...patch};
  try{
    if(S.mode==='db') await S.db.doc('settings/my').set({...S.my, updatedAt:Date.now()});
    else localStorage.setItem('setlog.my', JSON.stringify(S.my));

const T = {end:0,total:0,iv:null,label:'',ac:null};
function startTimer(sec,label){
  T.total=sec; T.end=Date.now()+sec*1000; T.label=label;
  try{ if(!T.ac) T.ac=new (window.AudioContext||window.webkitAudioContext)(); if(T.ac.state==='suspended') T.ac.resume(); }catch(e){}
  $('#timer').style.display='flex'; $('#timer').classList.remove('end');
  clearInterval(T.iv); T.iv=setInterval(tick,250); tick();
}
function tick(){
  const left=Math.max(0,Math.round((T.end-Date.now())/1000));
  $('#tTime').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  $('#tBar').style.width=(T.total?left/T.total*100:0)+'%';
  $('#tLbl').innerHTML = left? `휴식 중<br><span style="color:var(--text)">${esc(T.label)}</span>` : `휴식 끝!<br><span style="color:var(--text)">다음 세트 가요</span>`;
  if(!left && !$('#timer').classList.contains('end')){
    $('#timer').classList.add('end'); beep();
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    clearInterval(T.iv); $('#timer').style.display='none'; restPopup(T.label);
  }
}
function savedPop(){ const p=$('#savePop'); p.classList.remove('hidden'); clearTimeout(savedPop.t); savedPop.t=setTimeout(()=>p.classList.add('hidden'),1000); }
function restPopup(label){
  const p=$('#restPop'); $('#rpSub').textContent = label && !/마지막/.test(label) ? label : '다음 세트 가요';
  p.classList.remove('hidden'); p.classList.remove('out'); void p.offsetWidth; p.classList.add('in');
  clearTimeout(restPopup.t); restPopup.t=setTimeout(closeRestPop,3000);
}
function closeRestPop(){ clearTimeout(restPopup.t); const p=$('#restPop'); p.classList.add('hidden'); p.classList.remove('in'); }
function beep(){ try{ const ac=T.ac; if(!ac) return; [0,0.25].forEach(t=>{ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=880; g.gain.setValueAtTime(0.0001,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,ac.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.2); o.connect(g).connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.22); }); }catch(e){} }
$('#timer').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return; const v=b.dataset.t;
  if(v==='x'){ clearInterval(T.iv); $('#timer').style.display='none'; return; }
  if($('#timer').classList.contains('end')) return;
  T.end+=Number(v)*1000; T.total=Math.max(T.total+Number(v),1); tick();
});

    touch(S.date); closeSheet(); render(); const d=parse(src.date); toastMsg(`${d.getMonth()+1}/${d.getDate()} 운동 ${n}개를 불러왔어요`); return; }
  if(k==='load'){ const r=myRoutines()[+t.dataset.ri]; const l=ensureLog(S.date); const has=new Set(l.exercises.map(e=>e.name));

    if(!s.done){

  if(a==='rmset'){ const l=ensureLog(S.date); l.exercises[ei].sets.pop(); touch(S.date); render(); return; }
  if(a==='delex'){

      if(!ok) return; const l=ensureLog(S.date);
      if(all) l.exercises=[]; else l.exercises.forEach(e=>{ e.sets=e.sets.map(()=>blankSet(e)); e.memo=''; });
      delete l.startedAt; delete l.finishedAt; clearInterval(T.iv); $('#timer').style.display='none';

const PROFILE_KEY='setlog.profile';
function profile(){ try{ return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveProfile(p){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }catch(e){} }
function bmrHist(){ const P=profile(); let h=Array.isArray(P.bmrHist)?P.bmrHist.slice():[]; if(!h.length && num(P.bmr)) h=[{from:'0000-00-00',v:P.bmr}]; return h.sort((a,b)=>a.from<b.from?-1:1); }
function bmrFor(date){ const h=bmrHist(); if(!h.length) return 0; let v=h[0].v; h.forEach(x=>{ if(x.from<=date) v=x.v; }); return num(v)||0; }
S.dsd={}; S.dsb={};
function draftDiet(date){ if(!S.dsd[date]) S.dsd[date]=JSON.parse(JSON.stringify(dietOf(viewLog(date)))); return S.dsd[date]; }
function mealsOnly(d){ const o={}; MEALS.forEach(([k])=>{ o[k]=((d&&d[k])||[]).filter(x=>(x.n||'').trim()||num(x.k)).map(x=>({n:(x.n||'').trim(),k:String(x.k||''),q:(x.q&&num(x.q)!==1)?String(num(x.q)):''})); }); return o; }
function dietDirty(date){ const d=S.dsd[date]; if(!d) return false; const l=getLog(date); return !sameV(mealsOnly(d),mealsOnly(l&&l.diet)); }
function bodyDirty(date){ const b=S.dsb[date]; if(!b) return false; const l=getLog(date); return !sameV({bmr:(b.bmr||'').replace(/[^0-9]/g,''),wt:(b.wt||'').replace(/[^0-9.]/g,'')},{bmr:String(bmrFor(date)||''),wt:String((l&&l.diet&&l.diet.wt)||'')}); }
function markDiet(){ setBtn('saveDiet', dietDirty(S.date)); }
function dietOf(l){ const d=(l&&l.diet)||{}; MEALS.forEach(([k])=>{ if(!Array.isArray(d[k])) d[k]=[]; }); return d; }
function mealKcal(arr){ return arr.reduce((a,x)=>a+(num(x.k)||0),0); }
function dietKcal(l){ const d=dietOf(l); return MEALS.reduce((a,[k])=>a+mealKcal(d[k]),0); }
function hasDiet(l){ const d=l&&l.diet; if(!d) return false; return MEALS.some(([k])=>Array.isArray(d[k])&&d[k].some(x=>(x.n||'').trim()||num(x.k))) || !!num(d.wt); }
function weightFor(date){ // 그날 또는 그 이전에 가장 최근 입력한 체중 (없으면 처음 입력한 체중)
  const w={}; Object.keys(S.logs).forEach(k=>{ const v=num(S.logs[k].diet&&S.logs[k].diet.wt); if(v) w[k]=v; });
  Object.keys(S.local).forEach(k=>{ const L=S.local[k]; if(L&&L.diet&&'wt' in L.diet){ const v=num(L.diet.wt); if(v) w[k]=v; else delete w[k]; } });
  const ks=Object.keys(w).sort(); if(!ks.length) return num(profile().weight)||0;
  const before=ks.filter(k=>k<=date); return w[before.length?before[before.length-1]:ks[0]];
}
// 운동 소모 칼로리 (대략)
function burnOf(l, date){
  const wt=weightFor(date)||65; const r={weights:0,cardio:0,run:0,body:0};
  if(!l) return {...r,total:0,wt};
  let cardioMin=0, wsets=0;
  l.exercises.forEach(e=>{ const done=e.sets.filter(s=>s.done);
    if(fieldsOf(e)){ const m=done.reduce((a,s)=>a+(num(s.min)||0),0); cardioMin+=m; r.cardio+=9*wt*m/60; }
    else wsets+=done.length; });
  if(wsets){ let min=wsets*2.5;
    if(l.startedAt&&l.finishedAt){ const tot=(l.finishedAt-l.startedAt)/60000 - cardioMin; if(tot>5) min=Math.min(tot, wsets*6); }
    r.weights=5*wt*min/60; }
  const run=runOf(l); if(num(run.km)) r.run=1.0*wt*num(run.km);
  const push=(l.daily&&l.daily.push||[]).reduce((a,v)=>a+(num(v)||0),0);
  r.body=push*0.5 + puTotal(date,l.daily&&l.daily.pullup)*1.0;
  Object.keys(r).forEach(k=>r[k]=Math.round(r[k]));
  return {...r,total:r.weights+r.cardio+r.run+r.body,wt};
}

      <div class="sugg hidden" id="sg-${k}-${i}"></div>`; });
    h+=`<button class="ghost addf" data-act="dtadd" data-m="${k}">+ 음식 추가</button></div>`; });
  h+=`<div class="muted" style="font-size:12px;margin:-4px 4px 10px;line-height:1.6">음식 이름을 치면 자주 먹는 음식의 대략 칼로리가 떠요. 양이 다르면 숫자만 고치면 돼요.</div>
  <button class="btn ${dirtyD?'':'outline'}" id="saveDiet" style="width:100%;padding:13px;margin:0 0 18px" data-act="dtsave">저장</button>`;
  // 기초대사량 · 체중 · 눈바디
  const hb=bmrHist(), ph=(S.photos||[]).filter(p=>p.date===date);
  h+=`<div class="sec-title">기초대사량 · 체중 · 눈바디</div><div class="card">
    <div class="pugrid g2"><div class="unit" data-u="kcal"><input inputmode="numeric" placeholder="기초대사량" value="${esc(sb.bmr)}" data-di="bmr"></div>
      <div class="unit" data-u="kg"><input inputmode="decimal" placeholder="체중" value="${esc(sb.wt)}" data-di="wt"></div></div>
    <div class="muted" style="font-size:12px;margin-top:8px;line-height:1.6">${hb.length?`기초대사량을 바꾸면 <b style="color:var(--text);font-weight:500">${d.getMonth()+1}월 ${d.getDate()}일부터</b> 새 값이 적용돼요.`:'인바디에 나온 기초대사량을 넣어 주세요.'} 체중은 운동 소모 칼로리 계산에 쓰여요.</div>
    ${hb.length>1||(hb.length&&hb[0].from!=='0000-00-00')?`<div class="muted" style="font-size:12px;margin-top:4px;line-height:1.7">변경 기록: ${hb.map(x=>`${x.from==='0000-00-00'?'처음':x.from.slice(5).replace('-','/')} ${x.v}`).join(' → ')}</div>`:''}
    <button class="btn ${dirtyB?'':'outline'}" id="saveBody" style="width:100%;padding:12px;margin-top:12px" data-act="dtbody">저장</button>
    <div class="lbl" style="margin-top:18px">눈바디</div>
    <button class="btn sec" data-act="dtphoto" style="width:100%;padding:11px">+ 사진 추가</button>
    <input type="file" id="dtFile" accept="image/*" class="hidden">
    ${ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${p.data}" data-act="dtview" data-id="${p.id}">`).join('')}</div>`:`<div class="muted" style="font-size:12.5px;margin-top:10px">같은 장소·같은 자세로 찍으면 변화가 잘 보여요. 사진은 올리면 바로 저장돼요.</div>`}
    <button class="ghost" style="width:100%;margin-top:12px" data-act="dtgallery">눈바디 모아보기 ${(S.photos||[]).length?`(${S.photos.length}장)`:''}</button>
  </div>`;
  $('#view').innerHTML=h;
}

/* 사진 저장소 (IndexedDB) */
const PDB={db:null};
function pdb(){ return new Promise((res,rej)=>{ if(PDB.db) return res(PDB.db); if(!window.indexedDB) return rej(new Error('no idb'));
  const r=indexedDB.open('setlog-photos',1);
  r.onupgradeneeded=()=>{ r.result.createObjectStore('photos',{keyPath:'id'}); };
  r.onsuccess=()=>{ PDB.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }); }
async function photoAll(){ try{ const db=await pdb(); return await new Promise((res,rej)=>{ const q=db.transaction('photos').objectStore('photos').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); }); }catch(e){ return []; } }
async function photoPut(p){ const db=await pdb(); return new Promise((res,rej)=>{ const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').put(p); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function photoDel(id){ const db=await pdb(); return new Promise((res,rej)=>{ const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function loadPhotos(){ S.photos=(await photoAll()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts); }
function shrink(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const M=1000, s=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.8)); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; img.src=u; }); }

function openGallery(){
  const ps=S.photos||[]; const wts=allLogs().filter(l=>num(l.diet&&l.diet.wt)).map(l=>({d:l.date,v:num(l.diet.wt)}));
  let h=`<div class="sheet-in tall"><div class="sheet-top"><b>눈바디 모아보기</b><button class="x" data-g="close">×</button></div>`;
  if(wts.length>=2) h+=`<div class="lbl">체중 추이</div>${weightChart(wts)}`;
  else if(wts.length===1) h+=`<div class="muted" style="margin-bottom:10px">체중 기록이 2번 이상 쌓이면 그래프가 생겨요</div>`;
  if(!ps.length) h+=`<div class="empty-note">아직 사진이 없어요.<br>식단 탭 아래 "+ 사진"으로 기록해 보세요.</div>`;
  else {
    if(ps.length>=2){ const a=ps[0], b=ps[ps.length-1];
      h+=`<div class="lbl" style="margin-top:6px">처음 vs 최근</div><div class="cmp">${[a,b].map(p=>`<figure><img src="${p.data}" data-g="view" data-id="${p.id}"><figcaption>${p.date.slice(5).replace('-','/')}${weightFor(p.date)?` · ${weightFor(p.date)}kg`:''}</figcaption></figure>`).join('')}</div>`; }
    h+=`<div class="lbl" style="margin-top:12px">전체 사진</div><div class="pgrid">${ps.slice().reverse().map(p=>`<figure><img src="${p.data}" data-g="view" data-id="${p.id}"><figcaption>${p.date.slice(5).replace('-','/')}</figcaption></figure>`).join('')}</div>`;
  }
  h+=`</div>`;
  const sh=$('#sheet'); sh.innerHTML=h; sh.classList.remove('hidden'); document.body.style.overflow='hidden'; S.gallery=true;
}
function weightChart(pts){
  const W=480,H=150,pl=36,pr=10,pt=12,pb=22; const vs=pts.map(p=>p.v); const lo=Math.floor(Math.min(...vs)-1), hi=Math.ceil(Math.max(...vs)+1);
  const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(H-pt-pb)*(1-(v-lo)/((hi-lo)||1));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-bottom:8px">${[lo,hi].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#2e323a" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y(t)+4}" fill="#636a76" font-size="11" text-anchor="end">${t}</text>`).join('')}
    <path d="${pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="#5fd38d" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#5fd38d"/>`).join('')}
    <text x="${pl}" y="${H-5}" fill="#636a76" font-size="11">${pts[0].d.slice(5).replace('-','/')} ${pts[0].v}kg</text>
    <text x="${W-pr}" y="${H-5}" fill="#636a76" font-size="11" text-anchor="end">${pts[pts.length-1].d.slice(5).replace('-','/')} ${pts[pts.length-1].v}kg</text></svg>`;
}
function viewPhoto(id){
  const p=(S.photos||[]).find(x=>x.id===id); if(!p) return;
  const v=document.createElement('div'); v.className='pview'; v.innerHTML=`<img src="${p.data}"><div class="pvbar"><span>${p.date.slice(5).replace('-','/')}${weightFor(p.date)?` · ${weightFor(p.date)}kg`:''}</span><button class="btn sec" data-pv="del">삭제</button><button class="btn" data-pv="close">닫기</button></div>`;
  document.body.appendChild(v);
  v.addEventListener('click',ev=>{ const b=ev.target.closest('[data-pv]'); if(!b){ if(ev.target===v) v.remove(); return; }
    if(b.dataset.pv==='close') v.remove();
    else ask('사진을 삭제할까요?','삭제한 사진은 되돌릴 수 없어요.',true).then(async ok=>{ if(!ok) return; await photoDel(id); await loadPhotos(); v.remove(); if(S.gallery) openGallery(); render(); toastMsg('사진을 삭제했어요'); });
  });
}

// 이벤트
$('#view').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act;
  if(a==='dtday'){ S.date=t.dataset.d; render(); return; }
  if(a==='dtbody'){ const sb=S.dsb[S.date]; if(!sb){ savedPop(); return; }
    const b=(sb.bmr||'').replace(/[^0-9]/g,''), w=(sb.wt||'').replace(/[^0-9.]/g,'');
    if(b && +b!==bmrFor(S.date)){ const P=profile(); const first=!bmrHist().length; const from=first?'0000-00-00':S.date; let h=bmrHist().filter(x=>x.from!==from); h.push({from,v:b}); h.sort((x,y)=>x.from<y.from?-1:1); saveProfile({...P, bmr:h[h.length-1].v, bmrHist:h}); }
    const l=ensureLog(S.date); l.diet=dietOf(l); l.diet.wt=w; touch(S.date); delete S.dsb[S.date]; render(); savedPop(); return; }
  else if(a==='dteditpf'){ S.editProfile=true; render(); }
  else if(a==='dtsave'){ const d=S.dsd[S.date]; if(!d){ savedPop(); return; } const l=ensureLog(S.date); const wt=l.diet&&l.diet.wt; l.diet=JSON.parse(JSON.stringify(d)); l.diet.wt=wt||''; MEALS.forEach(([k])=>{ l.diet[k]=l.diet[k].filter(x=>(x.n||'').trim()||num(x.k)); }); delete S.dsd[S.date]; touch(S.date); render(); savedPop(); }
  else if(a==='dtadd'){ const dd=draftDiet(S.date); dd[t.dataset.m].push({n:'',k:''}); render();
    const ins=document.querySelectorAll(`[data-di=fn][data-m="${t.dataset.m}"]`); if(ins.length) ins[ins.length-1].focus(); }
  else if(a==='dtdel'){ const dd=draftDiet(S.date); dd[t.dataset.m].splice(+t.dataset.i,1); render(); }
  else if(a==='dtsug'){ const dd=draftDiet(S.date); const x=dd[t.dataset.m][+t.dataset.i]; x.n=t.dataset.n; x.u=t.dataset.k; x.k=String(Math.round(num(x.u)*(num(x.q)||1))); render(); }
  else if(a==='dtphoto'){ $('#dtFile').click(); }
  else if(a==='dtview'){ viewPhoto(t.dataset.id); }
  else if(a==='dtgallery'){ openGallery(); }
});
$('#view').addEventListener('change',async ev=>{
  if(ev.target.id!=='dtFile') return; const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{ const data=await shrink(f); await photoPut({id:uid()+Date.now().toString(36), date:S.date, data, ts:Date.now()}); await loadPhotos(); render(); toastMsg('사진을 저장했어요'); }
  catch(e){ toastMsg('사진을 저장하지 못했어요'); }
});
$('#view').addEventListener('input',ev=>{
  const t=ev.target, k=t.dataset.di; if(!k) return;
  if(k==='wt'||k==='bmr'){ const l=viewLog(S.date); if(!S.dsb[S.date]) S.dsb[S.date]={bmr:String(bmrFor(S.date)||''), wt:String((l.diet&&l.diet.wt)||'')}; S.dsb[S.date][k]=t.value; setBtn('saveBody', bodyDirty(S.date)); return; }
  const dd=draftDiet(S.date);
  const x=dd[t.dataset.m][+t.dataset.i];
  if(k==='fk'){ x.k=t.value.replace(/[^0-9]/g,''); x.u=x.k?String(num(x.k)/(num(x.q)||1)):''; markDiet(); updateKcalLive(); return; }
  if(k==='fq'){ const q0=num(x.q)||1; const u=num(x.u)||(num(x.k)?num(x.k)/q0:0); x.q=t.value.replace(/[^0-9.]/g,''); if(u){ x.u=String(u); x.k=String(Math.round(u*(num(x.q)||1))); const fk=t.closest('.frow').querySelector('.fk'); if(fk) fk.value=x.k; } markDiet(); updateKcalLive(); return; }
  if(k==='fn'){ x.n=t.value; markDiet();
    const sg=document.getElementById(`sg-${t.dataset.m}-${t.dataset.i}`); const q=t.value.replace(/\s/g,'');
    if(!sg) return; if(q.length<1){ sg.classList.add('hidden'); return; }
    const hits=FOODS.filter(([n])=>n.replace(/\s/g,'').includes(q)).slice(0,6);
    if(!hits.length){ sg.classList.add('hidden'); return; }
    sg.innerHTML=hits.map(([n,c])=>`<button data-act="dtsug" data-m="${t.dataset.m}" data-i="${t.dataset.i}" data-n="${esc(n)}" data-k="${c}"><span>${esc(n)}</span><b>${c} kcal</b></button>`).join('');
    sg.classList.remove('hidden'); }
});
$('#view').addEventListener('focusout',ev=>{ if(ev.target.dataset && ev.target.dataset.di==='fn'){ setTimeout(()=>{ const sg=document.getElementById(`sg-${ev.target.dataset.m}-${ev.target.dataset.i}`); if(sg && !sg.matches(':hover')) sg.classList.add('hidden'); if(S.tab==='diet') updateKcalLive(); },200); } });
function updateKcalLive(){ /* 숫자만 바뀌었을 때 화면 갱신 (입력 중 포커스 유지) */
  const ae=document.activeElement; if(ae && ae.dataset && (ae.dataset.di==='fn'||ae.dataset.di==='fk'||ae.dataset.di==='fq')) { clearTimeout(updateKcalLive.t); updateKcalLive.t=setTimeout(()=>{ const a2=document.activeElement; if(!(a2&&a2.dataset&&a2.dataset.di)) render(); },1200); return; }
  render(); }
document.getElementById('sheet').addEventListener('click',ev=>{
  const g=ev.target.closest('[data-g]'); if(!g) return;
  if(g.dataset.g==='close'){ S.gallery=false; closeSheet(); }
  else if(g.dataset.g==='view') viewPhoto(g.dataset.id);
});

$('#view').addEventListener('pointerdown',e=>{ if(e.target.closest('.sugg')) e.preventDefault(); });

/* ---------- 시작 ---------- */
try{ S.logs=JSON.parse(lsGet()||'{}')||{}; }catch(e){ S.logs={}; }
try{ S.my=JSON.parse(localStorage.getItem('setlog.my')||'null'); }catch(e){ S.my=null; }
S.photos=[]; loadPhotos().then(()=>{ if(S.tab==='diet') render(); });
setSync('','');
render();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') for(const k in saveTimers){ clearTimeout(saveTimers[k]); flush(k); } });
</script>
